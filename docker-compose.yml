services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: [REDACTED]
      POSTGRES_DB: medusa-store
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medusa-net

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    volumes:
      - redis-data:/data
    networks:
      - medusa-net

  app-test:
    image: alpine:3.20
    container_name: medusa-app-test
    command: ["sleep", "infinity"]
    networks:
      - medusa-net

volumes:
  postgres-data:
  redis-data:

networks:
  medusa-net:
    driver: bridge
    internal: true